version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile 
      cache_from:
        - study_task-app:latest
    container_name: study_task_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT = ${APP_PORT}
      - VERSION = ${VERSION}
    volumes:
      - ./app:/app